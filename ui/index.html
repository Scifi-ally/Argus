<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SinglePass3D — Video Input & 3D Model View</title>
  <meta name="description" content="SinglePass3D: Live Drone Video Input alongside Reconstructed 3D Model" />
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>
  <div id="app-container">
    
    <!-- Top Navigation Header -->
    <header id="app-header">
      <div class="brand-section">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <h1 class="brand-title">SinglePass3D</h1>
      </div>

      <div class="header-center">
        <div class="job-select-wrapper">
          <label class="job-select-label" for="job-selector">Dataset / Job</label>
          <select id="job-selector">
            <option value="zurich_mav_reconstruction">zurich_mav_reconstruction (Zurich Urban MAV)</option>
            <option value="job_001">job_001 (Orbit Drone Demo)</option>
          </select>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn-header active" id="btn-mode-rgb" data-mode="rgb" title="RGB Texture">
          <span>RGB Texture</span>
        </button>
        <button class="btn-header" id="btn-mode-semantics" data-mode="semantics" title="Semantic Segmentation">
          <span>Semantics</span>
        </button>
        <button class="btn-header" id="btn-mode-confidence" data-mode="confidence" title="Confidence Heatmap">
          <span>Confidence</span>
        </button>
        <button class="btn-header" id="btn-mode-normals" data-mode="normals" title="Surface Normals">
          <span>Normals</span>
        </button>
        <button class="btn-header" id="btn-toggle-wireframe" title="Toggle Wireframe">
          <span>Wireframe</span>
        </button>
        <button class="btn-header" id="btn-toggle-pointcloud" title="Toggle Point Cloud Mode">
          <span>Point Cloud</span>
        </button>
      </div>
    </header>

    <!-- Side-by-Side Split Workspace -->
    <main id="split-view">
      
      <!-- Left 50%: Live Video / Drone Frame Input Stream -->
      <section class="view-panel" id="video-panel">
        <div class="panel-header-tag">
          <span class="tag-dot"></span>
          <span>Drone Video Input Stream</span>
        </div>

        <div id="video-display-wrapper">
          <img id="drone-frame-img" src="" alt="Drone Video Frame Stream" />
          <video id="drone-video-el" playsinline muted loop></video>
        </div>

        <!-- Telemetry HUD Overlay -->
        <div class="telemetry-hud" id="telemetry-hud-box">
          <div id="hud-frame">Frame: 000 / 040</div>
          <div id="hud-timestamp">Time: 0.00s</div>
          <div id="hud-gps">GPS Datum: 47.384357° N, 8.545178° E (464.9m)</div>
        </div>
      </section>

      <!-- Right 50%: 3D Reconstructed Mesh & Camera Trajectory -->
      <section class="view-panel right-panel" id="model-panel">
        <div class="panel-header-tag">
          <span class="tag-dot model"></span>
          <span>Reconstructed 3D Model & Trajectory</span>
        </div>

        <div class="model-action-bar">
          <div class="interaction-mode-group">
            <button class="mode-toggle-btn active" id="btn-mode-orbit" title="Orbit Camera: rotate camera viewpoint">
              <span>Orbit View</span>
            </button>
            <button class="mode-toggle-btn" id="btn-mode-rot-model" title="Rotate Model: Left-drag rotates ONLY the 3D model (Camera & page stay fixed)">
              <span>Rotate Model</span>
            </button>
          </div>

          <div class="orientation-dropdown-wrapper">
            <select id="view-preset-selector" class="view-select" title="Camera Viewpoint Presets">
              <option value="aerial">Aerial 45°</option>
              <option value="top">Top-Down</option>
              <option value="front">Front View</option>
              <option value="side">Side View</option>
              <option value="isometric">Isometric</option>
            </select>
          </div>

          <button class="action-btn active" id="btn-toggle-grid" title="Toggle Ground Grid">
            <span>Grid</span>
          </button>
          <button class="action-btn active" id="btn-toggle-trajectory" title="Toggle Flight Trajectory">
            <span>Trajectory</span>
          </button>
          <button class="action-btn" id="btn-reset-cam" title="Reset View & Orientation">
            <span>Reset</span>
          </button>
        </div>

        <!-- Floating Model Orientation Control Card -->
        <div class="model-rotation-card" id="model-rot-card">
          <div class="rot-card-header">
            <span class="rot-card-title">Model Rotation</span>
            <button class="rot-card-reset" id="btn-quick-reset-rot" title="Reset Rotation to 0°">Reset</button>
          </div>
          <div class="rot-slider-row">
            <label for="slider-rot-z">Yaw (Z)</label>
            <input type="range" id="slider-rot-z" min="-180" max="180" step="1" value="0" />
            <span class="deg-val" id="val-rot-z">0°</span>
          </div>
          <div class="rot-slider-row">
            <label for="slider-rot-x">Pitch (X)</label>
            <input type="range" id="slider-rot-x" min="-90" max="90" step="1" value="0" />
            <span class="deg-val" id="val-rot-x">0°</span>
          </div>
          <div class="rot-slider-row">
            <label for="slider-rot-y">Roll (Y)</label>
            <input type="range" id="slider-rot-y" min="-90" max="90" step="1" value="0" />
            <span class="deg-val" id="val-rot-y">0°</span>
          </div>
          <div class="quick-rot-buttons">
            <button class="btn-micro" data-rot-z="-90" title="Rotate -90°">⟲ 90°</button>
            <button class="btn-micro" data-rot-z="-45" title="Rotate -45°">⟲ 45°</button>
            <button class="btn-micro" data-rot-z="-15" title="Rotate -15°">⟲ 15°</button>
            <button class="btn-micro" data-rot-z="15" title="Rotate +15°">15° ⟳</button>
            <button class="btn-micro" data-rot-z="45" title="Rotate +45°">45° ⟳</button>
            <button class="btn-micro" data-rot-z="90" title="Rotate +90°">90° ⟳</button>
            <button class="btn-micro" data-rot-z="180" title="Rotate 180°">180°</button>
          </div>
        </div>

        <canvas id="webgl-canvas"></canvas>
      </section>

      <!-- Bottom Synchronized Flight Timeline Scrubber -->
      <div class="sync-scrubber-bar">
        <button class="play-btn" id="btn-play-pause" title="Play/Pause Video & Flight Animation">
          <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="icon-pause" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>

        <div class="scrubber-info-col">
          <div class="scrubber-labels">
            <span id="label-cur-frame">Frame: 0 / 40</span>
            <span id="label-cur-time">0.00s</span>
          </div>
          <input type="range" id="frame-slider" min="0" max="39" value="0" step="1" />
        </div>
      </div>

    </main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
